name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - name: frontend
            context: ./frontend
            image: blog-frontend
          - name: server
            context: ./server
            image: blog-server
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/blog:${{ github.sha }}-${{ matrix.image }}
          platforms: linux/amd64

  build_pr:
    runs-on: self-hosted
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        include:
          - name: frontend
            context: ./frontend
            image: blog-frontend
          - name: server
            context: ./server
            image: blog-server
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: ${{ vars.DOCKERHUB_USERNAME }}/blog:${{ matrix.image }}-pr-${{ github.event.pull_request.number }}
          platforms: linux/amd64

  update_latest:
    needs: build
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        image: [blog-frontend, blog-server]
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Update ${{ matrix.image }} latest tag
        run: |
          docker pull ${{ vars.DOCKERHUB_USERNAME }}/blog:${{ github.sha }}-${{ matrix.image }}
          docker tag ${{ vars.DOCKERHUB_USERNAME }}/blog:${{ github.sha }}-${{ matrix.image }} ${{ vars.DOCKERHUB_USERNAME }}/blog:latest-${{ matrix.image }}
          docker push ${{ vars.DOCKERHUB_USERNAME }}/blog:latest-${{ matrix.image }}

  deploy:
    runs-on: self-hosted
    needs: [update_latest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ secrets.SERVER_APP_DIR }}
            docker pull ${{ vars.DOCKERHUB_USERNAME }}/blog:${{ github.sha }}
            docker compose -f compose.yml up -d --force-recreate
